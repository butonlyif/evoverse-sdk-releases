<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoVerse SDK — Documentation Portal</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f6f8fa; color: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22 !important; border-color: #30363d !important; }
    .card p, .ver, footer { color: #9198a1 !important; }
  }
  .wrap { text-align: center; padding: 2rem; max-width: 720px; width: 100%; }
  h1 { font-size: 1.6rem; margin-bottom: .4rem; }
  .ver { color: #59636e; margin-bottom: 2rem; font-size: .95rem; }
  .cards { display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
  .card {
    flex: 1 1 260px; max-width: 320px; padding: 1.5rem 1.25rem;
    background: #ffffff; border: 1px solid #d1d9e0; border-radius: 12px;
    text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .card h2 { font-size: 1.15rem; margin-bottom: .5rem; }
  .card p { font-size: .88rem; color: #59636e; }
  footer { margin-top: 2.5rem; font-size: .82rem; color: #59636e; }
  footer a { color: #0969da; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>EvoVerse SDK Documentation</h1>
  <p class="ver">v1.0.0 &middot; Efinix FPGA + RK3588 &middot; AI-driven development suite</p>
  <div class="cards">
    <a class="card" href="zh/customer-portal.html">
      <h2>中文文档门户</h2>
      <p>简体中文 &middot; 77 篇文档 &middot; 安装 / SDK / Efinity / RK3588 / 教程</p>
    </a>
    <a class="card" href="en/customer-portal.html">
      <h2>English Portal</h2>
      <p>English &middot; 77 docs &middot; Install / SDK / Efinity / RK3588 / Tutorials</p>
    </a>
  </div>
  <footer>
    <a href="https://github.com/butonlyif/evoverse-sdk-releases/releases">Downloads / 下载交付包</a>
  </footer>
</div>
<script>
  // 按浏览器语言自动进入对应门户（location.replace，返回键可回到本页）
  (function () {
    var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var target = lang.indexOf('zh') === 0 ? 'zh/customer-portal.html' : 'en/customer-portal.html';
    location.replace(target);
  })();
</script>
</body>
</html>
